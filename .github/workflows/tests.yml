name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt -r requirements-cms.txt
      - name: Site, blog and agent tests
        run: pytest -q
      - name: CMS tests
        working-directory: cms
        run: python manage.py test blog
      - name: Static build
        run: python freeze.py
