<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="ttl dsc" font-family="Archivo, Segoe UI, system-ui, sans-serif">
  <title id="ttl">Quy trình chatbot trả lời theo tài liệu</title>
  <desc id="dsc">Câu hỏi đi vào, truy xuất tài liệu, sinh câu trả lời và trích nguồn.</desc>
  <rect width="960" height="520" fill="#f3f2f2"/>
  <text x="40" y="80" font-size="15" font-weight="700" fill="#605d5d">Chuẩn bị một lần</text>
  <rect x="180" y="60" width="220" height="40" fill="#eae9e9"/>
  <text x="195" y="85" font-size="13" font-weight="700" fill="#201e1d">Số hóa</text>
  <line x1="400" y1="80" x2="420" y2="80" stroke="#605d5d" stroke-width="2"/>
  <rect x="420" y="60" width="220" height="40" fill="#eae9e9"/>
  <text x="435" y="85" font-size="13" font-weight="700" fill="#201e1d">Tách đoạn</text>
  <line x1="640" y1="80" x2="660" y2="80" stroke="#605d5d" stroke-width="2"/>
  <rect x="660" y="60" width="220" height="40" fill="#eae9e9"/>
  <text x="675" y="85" font-size="13" font-weight="700" fill="#201e1d">Chỉ mục</text>
  <text x="40" y="230" font-size="15" font-weight="700" fill="#201e1d">Mỗi câu hỏi</text>
  <rect x="40" y="245" width="120" height="50" fill="#eae9e9"/>
  <text x="50" y="275" font-size="13" font-weight="700" fill="#201e1d">Câu hỏi</text>
  <line x1="160" y1="270" x2="200" y2="270" stroke="#ec3013" stroke-width="3"/>
  <rect x="200" y="245" width="180" height="50" fill="#eae9e9"/>
  <text x="215" y="275" font-size="13" font-weight="700" fill="#201e1d">Truy xuất chỉ mục</text>
  <line x1="380" y1="270" x2="400" y2="270" stroke="#ec3013" stroke-width="3"/>
  <rect x="400" y="245" width="180" height="50" fill="#eae9e9"/>
  <text x="415" y="275" font-size="13" font-weight="700" fill="#201e1d">LLM + ngữ cảnh</text>
  <line x1="580" y1="270" x2="600" y2="270" stroke="#ec3013" stroke-width="3"/>
  <rect x="600" y="245" width="320" height="50" fill="#eae9e9"/>
  <text x="615" y="275" font-size="13" font-weight="700" fill="#201e1d">Trả lời + trích nguồn</text>
  <text x="40" y="380" font-size="15" font-weight="700" fill="#605d5d">Chatbot thường</text>
  <rect x="40" y="395" width="120" height="50" fill="#eae9e9"/>
  <text x="50" y="425" font-size="13" font-weight="700" fill="#201e1d">Câu hỏi</text>
  <line x1="160" y1="420" x2="185" y2="420" stroke="#605d5d" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="185" y="395" width="120" height="50" fill="#eae9e9"/>
  <text x="200" y="425" font-size="13" font-weight="700" fill="#201e1d">Mô hình</text>
  <line x1="305" y1="420" x2="340" y2="420" stroke="#605d5d" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="340" y="395" width="580" height="50" fill="#eae9e9"/>
  <text x="355" y="425" font-size="13" font-weight="700" fill="#201e1d">Trả lời, không nguồn</text>
</svg>
