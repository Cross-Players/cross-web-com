<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="ttl dsc" font-family="Archivo, Segoe UI, system-ui, sans-serif">
  <title id="ttl">AI chatbot answers from documents: pipeline</title>
  <desc id="dsc">User question enters, chatbot retrieves company documents, generates answer and cites source.</desc>
  <rect width="960" height="520" fill="#f3f2f2"/>

  <text x="40" y="90" font-size="15" font-weight="700" fill="#201e1d">Question</text>
  <rect x="40" y="110" width="150" height="60" fill="#eae9e9"/>
  <text x="52" y="145" font-size="12" fill="#201e1d">Customer / staff asks</text>

  <line x1="195" y1="140" x2="235" y2="140" stroke="#ec3013" stroke-width="3"/>
  <rect x="235" y="110" width="160" height="60" fill="#eae9e9"/>
  <text x="247" y="145" font-size="12" fill="#201e1d">Documents</text>

  <line x1="395" y1="140" x2="435" y2="140" stroke="#ec3013" stroke-width="3"/>
  <rect x="435" y="110" width="160" height="60" fill="#eae9e9"/>
  <text x="447" y="145" font-size="12" fill="#201e1d">Answer + citation</text>

  <text x="40" y="260" font-size="15" font-weight="700" fill="#201e1d">Process</text>
  <text x="40" y="282" font-size="12" fill="#605d5d">one question, one document, one answer</text>

  <rect x="40" y="320" width="260" height="90" fill="#eae9e9"/>
  <text x="55" y="360" font-size="13" font-weight="700" fill="#201e1d">1. Gather sources</text>
  <text x="55" y="382" font-size="11" fill="#605d5d">scan, normalize, split</text>

  <rect x="350" y="320" width="260" height="90" fill="#eae9e9"/>
  <text x="365" y="360" font-size="13" font-weight="700" fill="#201e1d">2. Retrieve</text>
  <text x="365" y="382" font-size="11" fill="#605d5d">find relevant chunks</text>

  <rect x="660" y="320" width="260" height="90" fill="#eae9e9"/>
  <text x="675" y="360" font-size="13" font-weight="700" fill="#201e1d">3. Generate + cite</text>
  <text x="675" y="382" font-size="11" fill="#605d5d">answer with source</text>
</svg>
