<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="zalo-chatbot-options-title zalo-chatbot-options-desc" font-family="Archivo, Segoe UI, system-ui, sans-serif">
  <title id="zalo-chatbot-options-title">Ba mức chatbot Zalo OA: kịch bản, AI, RAG</title>
  <desc id="zalo-chatbot-options-desc">Ba mức từ kịch bản cố định đến kịch bản kết hợp AI và RAG; mỗi mức có điều kiện để dừng ở đó.</desc>
  <defs>
    <marker id="zo-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#605d5d"/>
    </marker>
  </defs>
  <rect width="960" height="520" fill="#f3f2f2"/>
  <g fill="none" stroke="#605d5d" stroke-width="1.5">
    <path d="M280,238 H360" marker-end="url(#zo-arrow)"/>
    <path d="M600,238 H680" marker-end="url(#zo-arrow)"/>
  </g>
  <g fill="#eae9e9" stroke="#605d5d" stroke-width="1">
    <rect x="40" y="74" width="240" height="328" rx="8"/>
    <rect x="360" y="74" width="240" height="328" rx="8"/>
    <rect x="680" y="74" width="240" height="328" rx="8"/>
  </g>
  <g fill="#f3f2f2" stroke="#605d5d" stroke-width="1">
    <rect x="56" y="270" width="208" height="104" rx="6"/>
    <rect x="376" y="270" width="208" height="104" rx="6"/>
    <rect x="696" y="270" width="208" height="104" rx="6"/>
  </g>
  <g font-size="13" fill="#605d5d">
    <text x="60" y="110" font-weight="600">MỨC 1</text>
    <text x="380" y="110" font-weight="600">MỨC 2</text>
    <text x="700" y="110" font-weight="600">MỨC 3</text>
    <text x="60" y="180">Bot chạy theo menu và</text>
    <text x="60" y="200">từ khoá đã viết sẵn.</text>
    <text x="60" y="220">Không tự suy đoán ý.</text>
    <text x="380" y="180">AI đọc câu hỏi tự do</text>
    <text x="380" y="200">và chọn đúng kịch bản.</text>
    <text x="380" y="220">Câu trả lời vẫn do bạn viết.</text>
    <text x="700" y="180">Bot trả lời từ tài liệu</text>
    <text x="700" y="200">nội bộ đã kiểm duyệt,</text>
    <text x="700" y="220">và luôn kèm nguồn trích.</text>
    <text x="72" y="294" font-weight="600" fill="#201e1d">Dừng ở đây khi:</text>
    <text x="72" y="316">Phần lớn câu hỏi lặp lại</text>
    <text x="72" y="336">và nội dung ít thay đổi,</text>
    <text x="72" y="356">nên kịch bản cố định là đủ.</text>
    <text x="392" y="294" font-weight="600" fill="#201e1d">Dừng ở đây khi:</text>
    <text x="392" y="316">Khách hỏi nhiều cách khác</text>
    <text x="392" y="336">nhưng cùng một ý, và</text>
    <text x="392" y="356">không cần dữ liệu mới.</text>
    <text x="712" y="294" font-weight="600" fill="#201e1d">Dừng ở đây khi:</text>
    <text x="712" y="316">Tài liệu đã sạch và được</text>
    <text x="712" y="336">cập nhật đều. Phần còn lại</text>
    <text x="712" y="356">thì chuyển cho người.</text>
    <text x="320" y="228" text-anchor="middle">+ AI</text>
    <text x="640" y="228" text-anchor="middle">+ RAG</text>
    <text x="480" y="446" text-anchor="middle">Chỉ nâng cấp khi mức trước không đủ. Mỗi mức thêm một phần việc phải bảo trì.</text>
  </g>
  <g font-size="20" font-weight="600" fill="#201e1d">
    <text x="60" y="148">Kịch bản cố định</text>
    <text x="380" y="148">Kịch bản + AI</text>
    <text x="700" y="148">Kịch bản + RAG</text>
  </g>
</svg>
