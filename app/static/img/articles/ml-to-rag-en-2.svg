<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="mlrag2-title mlrag2-desc" font-family="Archivo, Segoe UI, system-ui, sans-serif">
  <title id="mlrag2-title">Today's RAG ladder: five rungs</title>
  <desc id="mlrag2-desc">Five ascending bars from left to right, labelled basic RAG, hybrid plus rerank, query rewriting with HyDE, graph and multi-hop, and agentic RAG. A vertical arrow on the right shows cost and complexity rising with each rung, and a note says most businesses stop at rung one or two.</desc>
  <defs>
    <marker id="mlrag2-arrow" viewBox="0 0 10 10" refX="5" refY="0" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 10 L5 0 L10 10 z" fill="#ec3013"/>
    </marker>
  </defs>

  <rect width="960" height="470" fill="#f3f2f2"/>

  <text x="480" y="42" text-anchor="middle" font-size="22" font-weight="bold" fill="#201e1d">Today's RAG ladder: five rungs</text>

  <rect x="48" y="280" width="156" height="80" rx="6" fill="#eae9e9" stroke="#605d5d" stroke-width="1.5"/>
  <text x="126" y="328" text-anchor="middle" font-size="22" font-weight="bold" fill="#605d5d">1</text>
  <rect x="208" y="240" width="156" height="120" rx="6" fill="#eae9e9" stroke="#605d5d" stroke-width="1.5"/>
  <text x="286" y="308" text-anchor="middle" font-size="22" font-weight="bold" fill="#605d5d">2</text>
  <rect x="368" y="200" width="156" height="160" rx="6" fill="#eae9e9" stroke="#605d5d" stroke-width="1.5"/>
  <text x="446" y="288" text-anchor="middle" font-size="22" font-weight="bold" fill="#605d5d">3</text>
  <rect x="528" y="160" width="156" height="200" rx="6" fill="#eae9e9" stroke="#605d5d" stroke-width="1.5"/>
  <text x="606" y="268" text-anchor="middle" font-size="22" font-weight="bold" fill="#605d5d">4</text>
  <rect x="688" y="120" width="156" height="240" rx="6" fill="#f3f2f2" stroke="#ec3013" stroke-width="3"/>
  <text x="766" y="248" text-anchor="middle" font-size="22" font-weight="bold" fill="#ec3013">5</text>

  <line x1="864" y1="352" x2="864" y2="132" stroke="#ec3013" stroke-width="2.5" marker-end="url(#mlrag2-arrow)"/>
  <text x="898" y="242" text-anchor="middle" font-size="18" fill="#605d5d" transform="rotate(-90 898 242)">cost and complexity rising</text>

  <text x="126" y="394" text-anchor="middle" font-size="18" fill="#201e1d">Basic RAG</text>
  <text x="286" y="394" text-anchor="middle" font-size="18" fill="#201e1d">Hybrid +</text>
  <text x="286" y="416" text-anchor="middle" font-size="18" fill="#201e1d">rerank</text>
  <text x="446" y="394" text-anchor="middle" font-size="18" fill="#201e1d">Query rewriting</text>
  <text x="446" y="416" text-anchor="middle" font-size="18" fill="#201e1d">(HyDE)</text>
  <text x="606" y="394" text-anchor="middle" font-size="18" fill="#201e1d">Graph /</text>
  <text x="606" y="416" text-anchor="middle" font-size="18" fill="#201e1d">multi-hop</text>
  <text x="766" y="394" text-anchor="middle" font-size="18" fill="#ec3013">Agentic RAG</text>

  <text x="480" y="450" text-anchor="middle" font-size="18" fill="#605d5d">Most firms stop at rung 1 or 2.</text>
</svg>
