<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-labelledby="ragml-en-title ragml-en-desc" font-family="Archivo, Segoe UI, system-ui, sans-serif">
  <title id="ragml-en-title">From training data and machine learning to an LLM, then RAG</title>
  <desc id="ragml-en-desc">Four boxes in a row: Data, ML model, LLM and RAG. The ML model learns from data, the LLM holds frozen knowledge, and RAG looks up documents before answering.</desc>
  <defs>
    <marker id="ragml-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#201e1d"/>
    </marker>
  </defs>

  <g>
    <rect x="40" y="85" width="180" height="100" rx="4" fill="#eae9e9" stroke="#d7d3d3" stroke-width="2"/>
    <text x="130" y="142" text-anchor="middle" font-size="20" font-weight="700" fill="#201e1d">Data</text>
  </g>

  <g>
    <rect x="280" y="85" width="180" height="100" rx="4" fill="#eae9e9" stroke="#d7d3d3" stroke-width="2"/>
    <text x="370" y="142" text-anchor="middle" font-size="20" font-weight="700" fill="#201e1d">ML model</text>
  </g>

  <g>
    <rect x="520" y="85" width="180" height="100" rx="4" fill="#eae9e9" stroke="#d7d3d3" stroke-width="2"/>
    <text x="610" y="142" text-anchor="middle" font-size="20" font-weight="700" fill="#201e1d">LLM</text>
  </g>

  <g>
    <rect x="760" y="85" width="180" height="100" rx="4" fill="#fff2ef" stroke="#ec3013" stroke-width="2"/>
    <text x="850" y="142" text-anchor="middle" font-size="20" font-weight="700" fill="#ec3013">RAG</text>
  </g>

  <g stroke="#201e1d" stroke-width="2" fill="none" marker-end="url(#ragml-en-arrow)">
    <line x1="224" y1="135" x2="272" y2="135"/>
    <line x1="464" y1="135" x2="512" y2="135"/>
    <line x1="704" y1="135" x2="752" y2="135"/>
  </g>

  <g font-size="15" font-weight="400" fill="#605d5d" text-anchor="middle">
    <text x="370" y="220">learns from data</text>
    <text x="610" y="220">frozen knowledge</text>
    <text x="850" y="212">looks up documents</text>
    <text x="850" y="233">before answering</text>
  </g>
</svg>
