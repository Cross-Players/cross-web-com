<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="zalo-chatbot-flow-en-title zalo-chatbot-flow-en-desc" font-family="Archivo, Segoe UI, system-ui, sans-serif">
  <title id="zalo-chatbot-flow-en-title">Zalo OA chatbot message flow</title>
  <desc id="zalo-chatbot-flow-en-desc">A customer messages Zalo OA; the chatbot reads intent and data, then answers, asks a clarifying question, or hands off to a person.</desc>
  <defs>
    <marker id="zf-arrow-en" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#605d5d"/>
    </marker>
    <marker id="zf-arrow-accent-en" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ec3013"/>
    </marker>
  </defs>
  <rect width="960" height="520" fill="#f3f2f2"/>
  <g fill="none" stroke="#605d5d" stroke-width="1.5">
    <path d="M280,102 H360" marker-end="url(#zf-arrow-en)"/>
    <path d="M440,152 V208" marker-end="url(#zf-arrow-en)"/>
    <path d="M800,152 V180 H520 V208" marker-end="url(#zf-arrow-en)"/>
    <path d="M360,258 H280" marker-end="url(#zf-arrow-en)"/>
    <path d="M600,258 H680" marker-end="url(#zf-arrow-en)"/>
    <path d="M800,308 V364" marker-end="url(#zf-arrow-en)"/>
    <path d="M280,414 H360" marker-end="url(#zf-arrow-en)"/>
  </g>
  <path d="M480,308 V364" fill="none" stroke="#ec3013" stroke-width="2" marker-end="url(#zf-arrow-accent-en)"/>
  <g fill="#eae9e9" stroke="#605d5d" stroke-width="1">
    <rect x="40" y="52" width="240" height="100" rx="8"/>
    <rect x="360" y="52" width="240" height="100" rx="8"/>
    <rect x="680" y="52" width="240" height="100" rx="8"/>
    <rect x="40" y="208" width="240" height="100" rx="8"/>
    <rect x="360" y="208" width="240" height="100" rx="8" stroke="#ec3013" stroke-width="2"/>
    <rect x="680" y="208" width="240" height="100" rx="8"/>
    <rect x="40" y="364" width="240" height="100" rx="8"/>
    <rect x="360" y="364" width="240" height="100" rx="8"/>
    <rect x="680" y="364" width="240" height="100" rx="8"/>
  </g>
  <g font-size="15" font-weight="600" fill="#201e1d">
    <text x="60" y="86">Customer</text>
    <text x="380" y="86">Zalo OA</text>
    <text x="700" y="86">Data sources</text>
    <text x="60" y="242">Clarify first</text>
    <text x="380" y="242">Chatbot</text>
    <text x="700" y="242">Answer now</text>
    <text x="60" y="398">Handoff rules</text>
    <text x="380" y="398">Human agent</text>
    <text x="700" y="398">Conversation log</text>
  </g>
  <g font-size="13" fill="#605d5d">
    <text x="60" y="110">messages Zalo at 21:00</text>
    <text x="380" y="110">the shop's business account</text>
    <text x="700" y="110">FAQ, price list,</text>
    <text x="700" y="128">order status</text>
    <text x="60" y="266">when details are missing</text>
    <text x="380" y="266">reads intent, looks up data</text>
    <text x="700" y="266">when the data is clear</text>
    <text x="60" y="422">refund, complaint,</text>
    <text x="60" y="440">out-of-scope request</text>
    <text x="380" y="422">takes over the handoff</text>
    <text x="700" y="422">question, reply, reason</text>
    <text x="492" y="340">handoff</text>
    <text x="812" y="340">logged</text>
  </g>
</svg>
