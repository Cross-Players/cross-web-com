<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="ragpipe-en-title ragpipe-en-desc" font-family="Archivo, Segoe UI, system-ui, sans-serif">
  <title id="ragpipe-en-title">The two phases of RAG: building the index and answering</title>
  <desc id="ragpipe-en-desc">Two lanes. Offline, Build the index: Documents, Chunking, Embedding, Vector DB. Online, Answer: Question, Embedding, Top-k search, Prompt, LLM, Answer with sources. A dashed arrow labelled match connects Top-k search to Vector DB.</desc>
  <defs>
    <marker id="ragpipe-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#201e1d"/>
    </marker>
    <marker id="ragpipe-en-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#ec3013"/>
    </marker>
  </defs>

  <text x="25" y="60" font-size="15" font-weight="700" letter-spacing="1.5" fill="#605d5d">OFFLINE · BUILD THE INDEX</text>

  <g>
    <rect x="25" y="90" width="150" height="110" rx="4" fill="#eae9e9" stroke="#d7d3d3" stroke-width="2"/>
    <text x="100" y="152" text-anchor="middle" font-size="20" font-weight="700" fill="#201e1d">Documents</text>
  </g>

  <g>
    <rect x="255" y="90" width="160" height="110" rx="4" fill="#eae9e9" stroke="#d7d3d3" stroke-width="2"/>
    <text x="335" y="152" text-anchor="middle" font-size="20" font-weight="700" fill="#201e1d">Chunking</text>
  </g>

  <g>
    <rect x="495" y="90" width="170" height="110" rx="4" fill="#eae9e9" stroke="#d7d3d3" stroke-width="2"/>
    <text x="580" y="152" text-anchor="middle" font-size="20" font-weight="700" fill="#201e1d">Embedding</text>
  </g>

  <g>
    <rect x="745" y="90" width="190" height="110" rx="4" fill="#eae9e9" stroke="#d7d3d3" stroke-width="2"/>
    <text x="840" y="152" text-anchor="middle" font-size="20" font-weight="700" fill="#201e1d">Vector DB</text>
  </g>

  <g stroke="#201e1d" stroke-width="2" fill="none" marker-end="url(#ragpipe-en-arrow)">
    <line x1="179" y1="145" x2="249" y2="145"/>
    <line x1="419" y1="145" x2="489" y2="145"/>
    <line x1="669" y1="145" x2="739" y2="145"/>
  </g>

  <text x="25" y="320" font-size="15" font-weight="700" letter-spacing="1.5" fill="#605d5d">ONLINE · ANSWER</text>

  <g>
    <rect x="25" y="350" width="105" height="120" rx="4" fill="#eae9e9" stroke="#d7d3d3" stroke-width="2"/>
    <text x="77" y="417" text-anchor="middle" font-size="18" font-weight="700" fill="#201e1d">Question</text>
  </g>

  <g>
    <rect x="157" y="350" width="120" height="120" rx="4" fill="#eae9e9" stroke="#d7d3d3" stroke-width="2"/>
    <text x="217" y="417" text-anchor="middle" font-size="18" font-weight="700" fill="#201e1d">Embedding</text>
  </g>

  <g>
    <rect x="304" y="350" width="140" height="120" rx="4" fill="#eae9e9" stroke="#d7d3d3" stroke-width="2"/>
    <text x="374" y="417" text-anchor="middle" font-size="18" font-weight="700" fill="#201e1d">Top-k search</text>
  </g>

  <g>
    <rect x="471" y="350" width="190" height="120" rx="4" fill="#fff2ef" stroke="#ffc4b8" stroke-width="2"/>
    <text x="566" y="405" text-anchor="middle" font-size="20" font-weight="700" fill="#ec3013">Prompt</text>
    <text x="566" y="431" text-anchor="middle" font-size="15" font-weight="400" fill="#ec3013">(question + context)</text>
  </g>

  <g>
    <rect x="688" y="350" width="80" height="120" rx="4" fill="#eae9e9" stroke="#d7d3d3" stroke-width="2"/>
    <text x="728" y="417" text-anchor="middle" font-size="18" font-weight="700" fill="#201e1d">LLM</text>
  </g>

  <g>
    <rect x="795" y="350" width="140" height="120" rx="4" fill="#fff2ef" stroke="#ffc4b8" stroke-width="2"/>
    <text x="865" y="404" text-anchor="middle" font-size="18" font-weight="700" fill="#ec3013">Answer</text>
    <text x="865" y="430" text-anchor="middle" font-size="18" font-weight="700" fill="#ec3013">with sources</text>
  </g>

  <g stroke="#201e1d" stroke-width="2" fill="none" marker-end="url(#ragpipe-en-arrow)">
    <line x1="134" y1="410" x2="151" y2="410"/>
    <line x1="281" y1="410" x2="298" y2="410"/>
    <line x1="448" y1="410" x2="465" y2="410"/>
    <line x1="665" y1="410" x2="682" y2="410"/>
    <line x1="772" y1="410" x2="789" y2="410"/>
  </g>

  <g stroke="#ec3013" stroke-width="2" fill="none" stroke-dasharray="6 6">
    <line x1="374" y1="346" x2="374" y2="270"/>
    <line x1="374" y1="270" x2="840" y2="270"/>
    <line x1="840" y1="270" x2="840" y2="200" marker-end="url(#ragpipe-en-arrow-accent)"/>
  </g>
  <text x="608" y="258" text-anchor="middle" font-size="15" font-weight="400" fill="#ec3013">match</text>
</svg>
