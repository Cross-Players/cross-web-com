<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="ttl dsc" font-family="Archivo, Segoe UI, system-ui, sans-serif">
  <title id="ttl">Thuế cuối năm 2026: khai thuế doanh nghiệp nhỏ</title>
  <desc id="dsc">Hồ sơ khai thuế trên màn hình máy tính, máy tính bỏ túi và dấu kiểm hoàn tất minh họa quy trình nộp thuế cuối năm.</desc>
  <defs>
    <style>
      :root {
        --color-bg: #f3f2f2;
        --color-surface: #eae9e9;
        --color-text: #201e1d;
        --color-accent: #ec3013;
        --color-neutral-400: #bab6b6;
        --color-neutral-700: #605d5d;
        --color-divider: color-mix(in srgb, #201e1d 40%, transparent);
      }
      .bg { fill: var(--color-bg); }
      .text { fill: var(--color-text); }
      .muted { fill: var(--color-neutral-700); }
      .accent { fill: var(--color-accent); }
      .line { fill: var(--color-neutral-400); }
      .line-sm { fill: var(--color-neutral-400); }
    </style>
  </defs>
  <rect class="bg" width="1200" height="630"/>

  <!-- Hồ sơ khai thuế (trái) -->
  <rect x="90" y="120" width="430" height="440" rx="6" fill="#ffffff" stroke="var(--color-divider)" stroke-width="1"/>
  <rect x="90" y="120" width="430" height="52" fill="var(--color-accent)" rx="6" ry="6"/>
  <text x="112" y="152" font-size="15" font-weight="800" fill="#ffffff">Khai thuế cuối năm 2026</text>
  <text x="112" y="190" font-size="14" class="text">Tổng hợp hóa đơn bán và hóa đơn mua</text>
  <rect x="112" y="212" width="300" height="8" class="line" rx="2"/>
  <rect x="112" y="230" width="210" height="8" class="line" rx="2"/>
  <rect x="112" y="252" width="270" height="8" class="line" rx="2"/>
  <rect x="112" y="274" width="300" height="8" class="line" rx="2"/>
  <text x="112" y="308" font-size="13" class="muted">TNDN · VAT · TNCN</text>
  <rect x="112" y="330" width="110" height="8" class="line-sm" rx="2"/>
  <rect x="112" y="350" width="170" height="8" class="line-sm" rx="2"/>
  <rect x="112" y="372" width="220" height="8" class="line-sm" rx="2"/>
  <text x="112" y="526" font-size="13" class="muted" text-anchor="middle">Hồ sơ thuế</text>

  <!-- Máy tính bỏ túi (giữa) -->
  <rect x="560" y="190" width="440" height="330" rx="10" fill="var(--color-surface)"/>
  <rect x="584" y="214" width="392" height="62" rx="6" fill="#ffffff"/>
  <text x="610" y="256" font-size="24" font-weight="800" class="muted">0.00</text>
  <text x="610" y="278" font-size="11" class="muted">TỔNG THUẾ PHẢI NỘP</text>
  <g font-size="10" class="muted">
    <circle cx="612" cy="324" r="9" fill="#ffffff" stroke="var(--color-neutral-400)" stroke-width="1.5"/>
    <text x="607" y="328" font-size="10">1</text>
    <circle cx="664" cy="324" r="9" fill="#ffffff" stroke="var(--color-neutral-400)" stroke-width="1.5"/>
    <text x="659" y="328" font-size="10">2</text>
    <circle cx="716" cy="324" r="9" fill="#ffffff" stroke="var(--color-neutral-400)" stroke-width="1.5"/>
    <text x="711" y="328" font-size="10">3</text>
    <circle cx="768" cy="324" r="9" fill="#ffffff" stroke="var(--color-neutral-400)" stroke-width="1.5"/>
    <text x="763" y="328" font-size="10">+</text>
    <circle cx="612" cy="358" r="9" fill="#ffffff" stroke="var(--color-neutral-400)" stroke-width="1.5"/>
    <text x="607" y="362" font-size="10">4</text>
    <circle cx="664" cy="358" r="9" fill="#ffffff" stroke="var(--color-neutral-400)" stroke-width="1.5"/>
    <text x="659" y="362" font-size="10">5</text>
    <circle cx="716" cy="358" r="9" fill="#ffffff" stroke="var(--color-neutral-400)" stroke-width="1.5"/>
    <text x="711" y="362" font-size="10">6</text>
    <circle cx="768" cy="358" r="9" fill="#ffffff" stroke="var(--color-neutral-400)" stroke-width="1.5"/>
    <text x="763" y="362" font-size="10">−</text>
    <circle cx="664" cy="392" r="9" fill="#ffffff" stroke="var(--color-neutral-400)" stroke-width="1.5"/>
    <text x="659" y="396" font-size="10">=</text>
    <circle cx="716" cy="392" r="9" fill="var(--color-accent)" stroke="none"/>
    <text x="711" y="396" font-size="10" fill="#ffffff">0</text>
  </g>
  <text x="780" y="490" font-size="13" class="muted" text-anchor="middle">Máy tính</text>

  <!-- Dấu kiểm hoàn tất (phải) -->
  <circle cx="1035" cy="330" r="54" fill="var(--color-accent)"/>
  <path d="M1004 326l24 28 44-52" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1035" y="406" font-size="13" font-weight="800" class="text" text-anchor="middle">Hoàn tất</text>
  <text x="1035" y="526" font-size="13" class="muted" text-anchor="middle">Khai thuế nhanh hơn với công cụ số</text>
</svg>
