  </g>

  <!-- row 3: semantic -->
  <text x="40" y="438" font-size="15" font-weight="700" fill="#201e1d">Theo ngữ nghĩa</text>
  <text x="40" y="460" font-size="12" fill="#605d5d">cắt khi đổi chủ đề</text>

  <rect x="240" y="400" width="190" height="70" fill="#eae9e9"/>
  <rect x="436" y="400" width="240" height="70" fill="#eae9e9"/>
  <rect x="682" y="400" width="218" height="70" fill="#eae9e9"/>

  <g stroke="#605d5d" stroke-width="2">
    <line x1="256" y1="424" x2="414" y2="424"/>
    <line x1="256" y1="440" x2="392" y2="440"/>
    <line x1="256" y1="456" x2="414" y2="456"/>

    <line x1="452" y1="424" x2="660" y2="424"/>
    <line x1="452" y1="440" x2="636" y2="440"/>
    <line x1="452" y1="456" x2="660" y2="456"/>

    <line x1="698" y1="424" x2="884" y2="424"/>
    <line x1="698" y1="440" x2="860" y2="440"/>
    <line x1="698" y1="456" x2="884" y2="456"/>
  </g>

  <g fill="#ec3013">
    <rect x="430" y="386" width="6" height="14"/>
    <rect x="676" y="386" width="6" height="14"/>
  </g>
</svg>
