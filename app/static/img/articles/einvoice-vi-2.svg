<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="einvoice-vi-2-title einvoice-vi-2-desc" font-family="Archivo, Segoe UI, system-ui, sans-serif">
  <title id="einvoice-vi-2-title">Mức phạt theo số hoá đơn không lập</title>
  <desc id="einvoice-vi-2-desc">Năm mức phạt của tổ chức: 1 hoá đơn 1 đến 2 triệu đồng; 2 đến 9 hoá đơn 2 đến 10 triệu đồng; 10 đến 19 hoá đơn 10 đến 30 triệu đồng; 20 đến 49 hoá đơn 30 đến 50 triệu đồng; 50 hoá đơn trở lên 60 đến 80 triệu đồng.</desc>
  <rect width="960" height="470" fill="#f3f2f2"/>

  <text x="40" y="62" font-size="22" font-weight="bold" fill="#201e1d">Mức phạt theo số hoá đơn không lập</text>
  <text x="40" y="92" font-size="18" fill="#605d5d">Nghị định 125/2020/NĐ-CP, sửa bởi Nghị định 310/2025/NĐ-CP</text>

  <line x1="120" y1="390" x2="920" y2="390" stroke="#605d5d" stroke-width="2"/>

  <rect x="120" y="352" width="100" height="38" fill="#eae9e9" stroke="#605d5d" stroke-width="2"/>
  <rect x="295" y="304" width="100" height="86" fill="#eae9e9" stroke="#605d5d" stroke-width="2"/>
  <rect x="470" y="241" width="100" height="149" fill="#eae9e9" stroke="#605d5d" stroke-width="2"/>
  <rect x="645" y="198" width="100" height="192" fill="#eae9e9" stroke="#605d5d" stroke-width="2"/>
  <rect x="820" y="147" width="100" height="243" fill="#ec3013"/>

  <text x="170" y="340" font-size="16" text-anchor="middle" fill="#201e1d">1–2 triệu</text>
  <text x="345" y="292" font-size="16" text-anchor="middle" fill="#201e1d">2–10 triệu</text>
  <text x="520" y="229" font-size="16" text-anchor="middle" fill="#201e1d">10–30 triệu</text>
  <text x="695" y="186" font-size="16" text-anchor="middle" fill="#201e1d">30–50 triệu</text>
  <text x="870" y="135" font-size="16" text-anchor="middle" font-weight="bold" fill="#ec3013">60–80 triệu</text>

  <text x="170" y="414" font-size="16" text-anchor="middle" fill="#605d5d">1 hoá đơn</text>
  <text x="345" y="414" font-size="16" text-anchor="middle" fill="#605d5d">2–9</text>
  <text x="520" y="414" font-size="16" text-anchor="middle" fill="#605d5d">10–19</text>
  <text x="695" y="414" font-size="16" text-anchor="middle" fill="#605d5d">20–49</text>
  <text x="870" y="414" font-size="16" text-anchor="middle" font-weight="bold" fill="#201e1d">50+</text>
</svg>
