<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="fig2-title fig2-desc">
  <title id="fig2-title">Penalty by number of invoices a shop fails to issue</title>
  <desc id="fig2-desc">Five penalty brackets for an organisation, in million VND: one invoice 1 to 2 million; two to nine invoices 2 to 10 million; ten to nineteen invoices 10 to 30 million; twenty to forty-nine invoices 30 to 50 million; fifty or more invoices 60 to 80 million. An individual pays half. Source: Decree 125/2020/ND-CP as amended by Decree 310/2025/ND-CP, effective 16 January 2026.</desc>

  <rect width="960" height="470" fill="#f3f2f2"/>

  <text x="60" y="62" font-family="Archivo, Segoe UI, system-ui, sans-serif" font-size="22" font-weight="700" fill="#201e1d">Penalty rises with the number of invoices</text>
  <text x="60" y="90" font-family="Archivo, Segoe UI, system-ui, sans-serif" font-size="16" fill="#605d5d">Decree 125/2020/ND-CP, as amended by Decree 310/2025/ND-CP</text>
  <text x="60" y="116" font-family="Archivo, Segoe UI, system-ui, sans-serif" font-size="16" fill="#605d5d">Penalty range for an organisation, in million VND</text>

  <line x1="90" y1="372" x2="870" y2="372" stroke="#201e1d" stroke-width="1.5"/>

  <rect x="128" y="362" width="120" height="10" rx="3" fill="#605d5d"/>
  <rect x="274" y="348.25" width="120" height="23.75" rx="3" fill="#605d5d"/>
  <rect x="420" y="300.75" width="120" height="71.25" rx="3" fill="#605d5d"/>
  <rect x="566" y="253.25" width="120" height="118.75" rx="3" fill="#605d5d"/>
  <rect x="712" y="182" width="120" height="190" rx="3" fill="#ec3013"/>

  <text x="188" y="350" text-anchor="middle" font-family="Archivo, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="#201e1d">1–2</text>
  <text x="334" y="336" text-anchor="middle" font-family="Archivo, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="#201e1d">2–10</text>
  <text x="480" y="288" text-anchor="middle" font-family="Archivo, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="#201e1d">10–30</text>
  <text x="626" y="240" text-anchor="middle" font-family="Archivo, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="#201e1d">30–50</text>
  <text x="772" y="169" text-anchor="middle" font-family="Archivo, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="700" fill="#ec3013">60–80</text>

  <text x="188" y="398" text-anchor="middle" font-family="Archivo, Segoe UI, system-ui, sans-serif" font-size="16" fill="#605d5d">1 invoice</text>
  <text x="334" y="398" text-anchor="middle" font-family="Archivo, Segoe UI, system-ui, sans-serif" font-size="16" fill="#605d5d">2–9 invoices</text>
  <text x="480" y="398" text-anchor="middle" font-family="Archivo, Segoe UI, system-ui, sans-serif" font-size="16" fill="#605d5d">10–19 invoices</text>
  <text x="626" y="398" text-anchor="middle" font-family="Archivo, Segoe UI, system-ui, sans-serif" font-size="16" fill="#605d5d">20–49 invoices</text>
  <text x="772" y="398" text-anchor="middle" font-family="Archivo, Segoe UI, system-ui, sans-serif" font-size="16" fill="#605d5d">50+ invoices</text>

  <text x="60" y="420" font-family="Archivo, Segoe UI, system-ui, sans-serif" font-size="16" fill="#605d5d">An individual pays half. The exact figure depends on what the tax authority establishes.</text>
</svg>
