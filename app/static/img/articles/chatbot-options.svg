<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="ttl dsc" font-family="Archivo, Segoe UI, system-ui, sans-serif">
  <title id="ttl">Ba lựa chọn chatbot trả lời theo tài liệu</title>
  <desc id="dsc">Công cụ sẵn, bot lập trình và RAG tự xây là ba lựa chọn khác nhau cho chatbot trả lời theo tài liệu.</desc>
  <rect width="960" height="520" fill="#f3f2f2"/>

  <text x="40" y="90" font-size="15" font-weight="700" fill="#201e1d">Công cụ sẵn</text>
  <rect x="240" y="110" width="240" height="70" fill="#eae9e9"/>
  <text x="255" y="145" font-size="12" fill="#201e1d">Chỉnh sửa nội dung</text>

  <text x="40" y="262" font-size="15" font-weight="700" fill="#201e1d">Bot lập trình</text>
  <rect x="240" y="282" width="240" height="70" fill="#eae9e9"/>
  <text x="255" y="317" font-size="12" fill="#201e1d">Luồng cố định, menu</text>

  <text x="40" y="424" font-size="15" font-weight="700" fill="#201e1d">RAG tự xây</text>
  <rect x="240" y="444" width="240" height="70" fill="#eae9e9"/>
  <text x="255" y="479" font-size="12" fill="#201e1d">Tự truy xuất và trích nguồn</text>
</svg>
