    <text x="570" y="210" text-anchor="middle" font-size="20" font-weight="700" fill="#201e1d">Điểm số</text>
  </g>
  <g>
    <rect x="685" y="160" width="250" height="84" rx="4" fill="#f3f2f2" stroke="#d7d3d3" stroke-width="2"/>
