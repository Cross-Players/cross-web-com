<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="cd-en-2-title cd-en-2-desc" font-family="Archivo, Segoe UI, system-ui, sans-serif">
  <title id="cd-en-2-title">One log record, six fields</title>
  <desc id="cd-en-2-desc">A single conversation log record with message id, intent label, the answer sent, the cited document with its version date, the decision and the reviewer.</desc>
  <rect width="960" height="520" fill="#f3f2f2"/>
  <text x="480" y="42" text-anchor="middle" font-size="22" font-weight="bold" fill="#201e1d">One log record, six fields</text>
  <text x="480" y="72" text-anchor="middle" font-size="18" fill="#605d5d">The fourth field is the one usually missing</text>

  <rect x="120" y="92" width="720" height="348" rx="10" fill="#f3f2f2" stroke="#605d5d" stroke-width="2"/>

  <text x="150" y="129" font-size="18" fill="#605d5d">message id</text>
  <text x="420" y="129" font-size="18" fill="#201e1d">msg_8841</text>
  <line x1="150" y1="150" x2="810" y2="150" stroke="#605d5d" stroke-width="1" stroke-opacity="0.35"/>

  <text x="150" y="187" font-size="18" fill="#605d5d">intent label</text>
  <text x="420" y="187" font-size="18" fill="#201e1d">price</text>
  <line x1="150" y1="208" x2="810" y2="208" stroke="#605d5d" stroke-width="1" stroke-opacity="0.35"/>

  <text x="150" y="245" font-size="18" fill="#605d5d">answer sent</text>
  <text x="420" y="245" font-size="18" fill="#201e1d">"Our price is 199,000 VND."</text>
  <line x1="150" y1="266" x2="810" y2="266" stroke="#605d5d" stroke-width="1" stroke-opacity="0.35"/>

  <rect x="120" y="272" width="6" height="58" fill="#ec3013"/>
  <text x="150" y="303" font-size="18" font-weight="bold" fill="#201e1d">cited document</text>
  <text x="420" y="303" font-size="18" fill="#201e1d">price-list-2026-07.pdf</text>
  <text x="420" y="325" font-size="18" fill="#ec3013">version date 2026-07-14</text>
  <line x1="150" y1="338" x2="810" y2="338" stroke="#605d5d" stroke-width="1" stroke-opacity="0.35"/>

  <text x="150" y="375" font-size="18" fill="#605d5d">decision</text>
  <text x="420" y="375" font-size="18" fill="#201e1d">answer / re-ask / handoff  -&gt;  handoff</text>
  <line x1="150" y1="396" x2="810" y2="396" stroke="#605d5d" stroke-width="1" stroke-opacity="0.35"/>

  <text x="150" y="425" font-size="18" fill="#605d5d">reviewer</text>
  <text x="420" y="425" font-size="18" fill="#201e1d">T. Nguyen, 2026-10-30</text>

  <text x="480" y="482" text-anchor="middle" font-size="18" fill="#605d5d">Without the version date, every review reopens the same argument.</text>
</svg>
