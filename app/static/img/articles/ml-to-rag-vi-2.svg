<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="mtr2-title mtr2-desc" font-family="Archivo, Segoe UI, system-ui, sans-serif">
  <title id="mtr2-title">Năm nấc thang RAG ngày nay</title>
  <desc id="mtr2-desc">Năm bậc xếp cao dần từ trái sang phải: RAG cơ bản, hybrid và rerank, viết lại câu hỏi bằng HyDE, graph hoặc nhiều bước, agentic RAG. Mũi tên bên phải cho thấy chi phí và độ phức tạp tăng theo từng nấc; phần lớn doanh nghiệp nhỏ dừng ở nấc 1 hoặc 2.</desc>
  <defs>
    <marker id="mtr2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#ec3013"/>
    </marker>
  </defs>

  <rect width="960" height="470" fill="#f3f2f2"/>

  <text x="480" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#201e1d">Năm nấc thang RAG ngày nay</text>

  <line x1="40" y1="380" x2="700" y2="380" stroke="#605d5d" stroke-width="1.5"/>

  <g fill="#eae9e9" stroke="#605d5d" stroke-width="1.5">
    <rect x="50" y="300" width="120" height="80" rx="4"/>
    <rect x="180" y="260" width="120" height="120" rx="4"/>
    <rect x="310" y="220" width="120" height="160" rx="4"/>
    <rect x="440" y="180" width="120" height="200" rx="4"/>
  </g>
  <rect x="570" y="140" width="120" height="240" rx="4" fill="#f3f2f2" stroke="#ec3013" stroke-width="2.5"/>

  <g text-anchor="middle" font-size="20" font-weight="700">
    <text x="110" y="334" fill="#201e1d">1</text>
    <text x="240" y="294" fill="#201e1d">2</text>
    <text x="370" y="254" fill="#201e1d">3</text>
    <text x="500" y="214" fill="#201e1d">4</text>
    <text x="630" y="174" fill="#ec3013">5</text>
  </g>

  <g text-anchor="middle" font-size="16" fill="#605d5d">
    <text x="110" y="406">RAG cơ bản</text>
    <text x="240" y="406">Hybrid + rerank</text>
    <text x="370" y="406">HyDE</text>
    <text x="500" y="406">Graph / nhiều bước</text>
    <text x="630" y="406">Agentic RAG</text>
  </g>

  <line x1="870" y1="360" x2="870" y2="150" stroke="#ec3013" stroke-width="2" marker-end="url(#mtr2-arrow)"/>

  <g font-size="16" fill="#605d5d">
    <text x="760" y="214">chi phí và</text>
    <text x="760" y="238">độ phức tạp</text>
    <text x="760" y="262">tăng</text>
  </g>

  <text x="480" y="444" text-anchor="middle" font-size="16" fill="#605d5d">Phần lớn doanh nghiệp nhỏ dừng ở nấc 1 hoặc 2.</text>
</svg>
