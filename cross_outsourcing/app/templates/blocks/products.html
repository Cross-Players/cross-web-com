{# Flip cards: front face = App Store, back face = Google Play.
   Flipping is pure CSS (a visually hidden checkbox + <label>), so it works
   without JavaScript and from the keyboard (Tab to the card's toggle, Space). #}
{% set d = block.data %}
{% set store_names = {'app_store': 'App Store', 'google_play': 'Google Play'} %}
<section id="{{ d.id }}" class="section" aria-labelledby="{{ d.id }}-title">
  {% include "blocks/_section_head.html" %}
  <ul class="product-grid">
    {% for p in d['items'] %}
    {% set flip_id = 'flip-' ~ loop.index %}
    <li class="product">
      <input class="product__toggle" type="checkbox" id="{{ flip_id }}" aria-label="{{ d.ui.flip_label|replace('{name}', p.name) }}">
      <div class="product__card">
        {% for s in p.stores %}
        {% set store = store_names[s.store] %}
        <div class="product__face product__face--{{ 'front' if loop.first else 'back' }}">
          <a class="product__link" href="{{ s.url }}" target="_blank" rel="noopener">
            {% if p.cover %}
            <span class="product__cover"><img src="{{ asset(p.cover) }}" alt="" width="960" height="480" loading="lazy" decoding="async"></span>
            {% endif %}
            <span class="product__content">
              <span class="product__head">
                {% if p.icon %}<img class="product__icon" src="{{ asset(p.icon) }}" alt="" width="128" height="128" loading="lazy" decoding="async">{% endif %}
                <span>
                  <span class="product__store">
                    {% if s.store == 'app_store' %}
                    <svg aria-hidden="true" viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M16.4 12.6c0-2.4 2-3.6 2.1-3.7-1.2-1.7-3-1.9-3.6-1.9-1.5-.2-3 .9-3.8.9s-2-.9-3.3-.9C6.100 7.100 4.500 8.100 3.600 9.600c-1.800 3.100-.5 7.700 1.300 10.200.9 1.200 1.900 2.600 3.200 2.600 1.300-.1 1.800-.8 3.300-.8s2 .8 3.300.8c1.400 0 2.300-1.300 3.100-2.500 1-1.400 1.400-2.800 1.400-2.900 0 0-2.700-1-2.800-4.100zM14 5.500c.7-.8 1.200-2 1-3.100-1 0-2.200.7-2.900 1.500-.6.700-1.200 1.900-1 3 1.100.1 2.200-.6 2.900-1.400z"/></svg>
                    {% else %}
                    <svg aria-hidden="true" viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M4 2.5v19l10-9.500zM15.400 13.300l2.600 2.500-11.300 6.300zm0-2.600L6.700 1.900 18 8.200zm1.100 1.300 3.200-1.800c.9.500.9 1.100 0 1.600l-3.200 1.800z"/></svg>
                    {% endif %}
                    {{ store }}
                  </span>
                  <h3>{{ p.name }}</h3>
                </span>
              </span>
              <span class="product__app"{% if s.lang %} lang="{{ s.lang }}"{% endif %}>{{ s.app_name }}</span>
              <span class="product__publisher">{{ p.publisher }}</span>
              <span class="product__body text-muted">{{ p.body }}</span>
              <span class="product__tags">
                {% for t in p.tags %}<span class="tag tag-neutral">{{ t }}</span>{% endfor %}
              </span>
              <span class="product__cta">{{ d.ui.open_in|replace('{store}', store) }} <span aria-hidden="true">↗</span><span class="sr-only"> {{ d.ui.new_tab }}</span></span>
            </span>
          </a>
          <label class="product__flip" for="{{ flip_id }}" aria-hidden="true">
            <span aria-hidden="true">⟲</span> {{ d.ui.flip_to_google_play if loop.first else d.ui.flip_to_app_store }}
          </label>
        </div>
        {% endfor %}
      </div>
    </li>
    {% endfor %}
  </ul>
</section>
